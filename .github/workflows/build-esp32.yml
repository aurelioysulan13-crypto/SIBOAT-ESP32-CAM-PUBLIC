name: Build SIBOAT ESP32-CAM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.11
          
      - name: Prepare Edge Impulse library
        run: |
          rm -rf build/libraries/siboat_inferencing
          mkdir -p build/libraries/siboat_inferencing/src

          unzip -q siboat_inferencing.zip -d build/ei_unpacked

          echo "Searching for Edge Impulse library..."

          EI_HEADER=$(find build/ei_unpacked -name siboat_inferencing.h -type f | head -1)

          if [ -z "$EI_HEADER" ]; then
            echo "::error::siboat_inferencing.h was not found in the supplied ZIP."
            exit 1
          fi

          EI_SRC=$(dirname "$EI_HEADER")

          echo "Edge Impulse source directory:"
          echo "$EI_SRC"

          cp -a "$EI_SRC"/. build/libraries/siboat_inferencing/src/

          echo "Checking for Edge Impulse SDK..."

          if [ ! -f "build/libraries/siboat_inferencing/src/edge-impulse-sdk/dsp/image/image.hpp" ]; then
            echo "::error::edge-impulse-sdk/dsp/image/image.hpp was not found."
            echo "Library tree:"
            find build/libraries/siboat_inferencing -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Edge Impulse SDK found successfully."

          echo "Library contents:"
          find build/libraries/siboat_inferencing/src -maxdepth 3 -type f | head -100

      - name: Prepare sketch
        run: |
          mkdir -p build/sketch
          cp SIBOAT_ESP32-CAM_FINAL_FIRMWARE-3.ino build/sketch/sketch.ino

      - name: Compile firmware
        run: |
          mkdir -p build/output

          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32cam:PartitionScheme=huge_app,CPUFreq=240,FlashMode=qio,FlashFreq=80' \
            --libraries build/libraries \
            --output-dir build/output \
            --export-binaries \
            build/sketch

      - name: Show build output
        if: always()
        run: |
          echo "Build output:"
          find build/output -maxdepth 2 -type f -printf '%p %s bytes\n' || true

      - name: Package firmware
        if: success()
        run: |
          mkdir -p release

          cp build/output/*.bin release/ 2>/dev/null || true
          cp build/output/*.elf release/ 2>/dev/null || true
          cp build/output/*.map release/ 2>/dev/null || true

          sha256sum release/* > release/SHA256SUMS.txt

          echo "Release contents:"
          ls -lh release

      - name: Upload compiled firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT-ESP32-CAM-firmware
          path: release/
          if-no-files-found: error
